name: Release Workflow
'on':
  workflow_dispatch:
    inputs:
      version:
        description: Mod version to release
        type: string
        required: true
      disable_checks:
        description: Disable all version checks, including format validation
        type: boolean
        default: false
      dry_run:
        description: Dry run
        type: boolean
        default: false
jobs:
  call-release-workflow:
    permissions:
      contents: write
      packages: write
    uses: Crystal-Nest/.github/.github/workflows/release.yml@main
    with:
      java-version: '25'
      modrinth-project-id: soul-fire-d
      curseforge-project-id: '662413'
      version: ${{ inputs.version }}
      disable_checks: ${{ inputs.disable_checks }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
