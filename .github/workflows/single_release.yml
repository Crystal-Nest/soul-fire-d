name: Single Release Workflow
'on':
  workflow_dispatch:
    inputs:
      loader_fabric:
        description: Fabric Loader
        type: boolean
        default: false
      loader_neoforge:
        description: NeoForge Loader
        type: boolean
        default: false
      loader_common:
        description: Common Loader
        type: boolean
        default: false
      platform_maven:
        description: Publish to Maven
        type: boolean
        default: false
      platform_github:
        description: Publish to GitHub
        type: boolean
        default: false
      platform_curseforge:
        description: Publish to CurseForge
        type: boolean
        default: false
      platform_modrinth:
        description: Publish to Modrinth
        type: boolean
        default: false
      dry_run:
        description: Dry run
        type: boolean
        default: false
jobs:
  call-single-release-workflow:
    permissions:
      contents: write
      packages: write
    uses: Crystal-Nest/.github/.github/workflows/single_release.yml@main
    with:
      java-version: '25'
      modrinth-project-id: soul-fire-d
      curseforge-project-id: '662413'
      loader_fabric: ${{ inputs.loader_fabric }}
      loader_neoforge: ${{ inputs.loader_neoforge }}
      loader_common: ${{ inputs.loader_common }}
      platform_maven: ${{ inputs.platform_maven }}
      platform_github: ${{ inputs.platform_github }}
      platform_curseforge: ${{ inputs.platform_curseforge }}
      platform_modrinth: ${{ inputs.platform_modrinth }}
      dry_run: ${{ inputs.dry_run }}
    secrets: inherit
