plugins {
  id "java-library"
  id "maven-publish"
  id "com.hypherionmc.modutils.modpublisher"
}

def minecraft_target = minecraft_version + minecraft_patch_version

def game_versions = [minecraft_version]
if (minecraft_version != minecraft_target) {
  def minParts = minecraft_version.tokenize('.')
  def maxParts = minecraft_target.tokenize('.')
  if (minParts.size() >= 2 && maxParts.size() >= 2) {
    def base = "${minParts[0]}.${minParts[1]}"
    int minPatch = minParts.size() > 2 ? minParts[2].toInteger() : 0
    int maxPatch = maxParts.size() > 2 ? maxParts[2].toInteger() : 0
    for (int i = minPatch + 1; i <= maxPatch; i++) {
      game_versions << "${base}.${i}"
    }
  } else {
    game_versions << minecraft_target
  }
}
game_versions = game_versions.collect { String.valueOf(it) }.unique()

base {
  archivesName = "$mod_id_kebab-$name"
  version = "$minecraft_version-$mod_version"
}

java {
  toolchain.languageVersion = JavaLanguageVersion.of(java_version)
  withSourcesJar()
  withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
  it.options.encoding = "UTF-8"
  it.options.getRelease().set(java_version as Integer)
}

repositories {
  mavenCentral()
  exclusiveContent {
    forRepository {
      maven {
        name = "Sponge"
        url = "https://repo.spongepowered.org/repository/maven-public"
      }
    }
    filter { includeGroupAndSubgroups("org.spongepowered") }
  }
  exclusiveContent {
    forRepository {
      maven {
        name = "Crystal Nest"
        url = "https://maven.crystalnest.it"
      }
    }
    filter {
      includeGroup "it.crystalnest"
    }
  }
}

dependencies {
  api "it.crystalnest:cobweb-$name:26.1-$cobweb_version"
  api "it.crystalnest:prometheus-$name:26.1-$prometheus_version"
}

sourcesJar {
  from(rootProject.file("LICENSE")) {
    rename { "${it}_$mod_title" }
  }
}

jar {
  from(rootProject.file("LICENSE")) {
    rename { "${it}_$mod_title" }
  }
  manifest {
    attributes([
      "Specification-Title"     : mod_title,
      "Specification-Vendor"    : mod_authors,
      "Specification-Version"   : project.version,
      "Implementation-Title"    : mod_title,
      "Implementation-Vendor"   : mod_authors,
      "Implementation-Version"  : project.version,
      "Implementation-URL"      : "https://github.com/$github_user/$mod_id_kebab/tree/$minecraft_version",
      "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
      "Timestamp"               : System.currentTimeMillis(),
      "Built-On-Java"           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
      "Built-On-Minecraft"      : minecraft_target
    ])
  }
}

processResources {
  def expandProps = [
    "java_version"                 : java_version,
    "mod_version"                  : mod_version,
    "group"                        : project.group,
    "mod_authors"                  : mod_authors,
    "mod_title"                    : mod_title,
    "mod_id"                       : mod_id,
    "mod_id_kebab"                 : mod_id_kebab,
    "license"                      : license,
    "description"                  : project.description,
    "credits"                      : credits,
    "github_user"                  : github_user,
    "curseforge_id"                : curseforge_id,
    "minecraft_version"            : minecraft_version,
    "pack_format"                  : pack_format,
    "fabric_version"               : fabric_version,
    "fabric_loader_version"        : fabric_loader_version,
    "neoforge_version"             : neoforge_version,
    "cobweb_version"               : cobweb_version,
    "prometheus_version"           : prometheus_version,
  ]
  filesMatching(["**/pack.mcmeta", "fabric.mod.json", "META-INF/neoforge.mods.toml", "*.mixins.json"]) {
    expand expandProps
  }
  inputs.properties(expandProps)
}

def noPublish = name == "common"
def changelog_body = "See [Changelog](https://github.com/$github_user/$mod_id_kebab/blob/master/CHANGELOG.md#v${mod_version.replaceAll('\\.', '')}---${new Date().format("yyyyMMdd")})."
def version_type = mod_version.replaceFirst("([0-9]+\\.?)+-?", "").with { it ? it : (mod_version.startsWith("0") ? "beta" : "release") }
def loader = "Common"
switch (name) {
  case "fabric":
    loader = "Fabric"
    break
  case "neoforge":
    loader = "NeoForge"
    break
}

publishing {
  repositories {
    maven {
      name = "GitHubPackages"
      url = uri("https://maven.pkg.github.com/$github_user/$mod_id_kebab")
      credentials {
        username = github_user
        password = System.getenv("GITHUB_TOKEN") ?: ""
      }
    }
  }
  publications {
    gpr(MavenPublication) {
      groupId = project.group
      artifactId = "$mod_id_kebab-${loader.toLowerCase()}"
      version = project.version
      from components.java
      pom {
        name = "[$loader - $minecraft_version] $mod_title v$mod_version"
        description = "$description"
        url = "https://github.com/$github_user/$mod_id_kebab/tree/$minecraft_version"
        issueManagement {
          system = "github"
          url = "https://github.com/$github_user/$mod_id_kebab/issues"
        }
        licenses {
          license {
            name = license
            url = "https://github.com/Crystal-Nest/.github/blob/main/LICENSE"
          }
        }
        developers {
          mod_authors.split(", ").each { author ->
            developer {
              id = author.toLowerCase()
              name = author
            }
          }
        }
      }
    }
  }
}

publisher {
  apiKeys {
    github System.getenv("GITHUB_TOKEN") ?: ""
    modrinth System.getenv("MODRINTH_TOKEN") ?: ""
    curseforge System.getenv("CURSEFORGE_TOKEN") ?: ""
  }
  setDebug(noPublish)
  setVersion(mod_version)
  setChangelog(changelog_body)
  setVersionType(version_type)
  setArtifact(jar)
  setDisableMalwareScanner(true) // Disable the built in Fractureizer scanner.
  setDisableEmptyJarCheck(true) // Disable check for valid mod metadata entry in artifact, which could possibly mean that the jar is empty.
  setModrinthID(mod_id_kebab)
  setCurseID(curseforge_id)
  if (!noPublish) {
    setLoaders(loader)
  }
  setGameVersions(game_versions.toArray(new String[0]))
  setDisplayName("[$loader - $minecraft_version] $mod_title v$mod_version")
  setJavaVersions([JavaVersion.VERSION_25]) // Remember to update this to match java_version gradle property.
  setCurseEnvironment("both") // "server", "client" or "both".
  github {
    repo = "$github_user/$mod_id_kebab"
    tag = "v${project.version}"
    displayName("v${project.version}")
    target = minecraft_version
    createTag = true
    createRelease = true
    updateRelease = true
    draft = false
  }
  modrinthDepends {
    required "cobweb"
    required "prometheus-api"
    switch (loader) {
      case "Fabric":
        required "fabric-api"
        break
      case "NeoForge":
        break
    }
  }
  curseDepends {
    required "cobweb"
    required "prometheus"
    switch (loader) {
      case "Fabric":
        required "fabric-api"
        break
      case "NeoForge":
        break
    }
  }
}

tasks.register("publishLoader") {
  group = "publishing"
  description = "Publish $loader specific versions to all platforms"
  dependsOn "publish"
  dependsOn "publishMod"
}
